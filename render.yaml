services:
  - type: web
    name: drishti-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: CORS_ORIGINS
        sync: false
      - key: AVIATION_STACK_KEY
        sync: false
