<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jules Tracker - Plan Builder</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f5f5f5; margin: 0; padding: 1rem; color: #333; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 1.5rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1, h2 { text-align: center; margin-top: 0; }
        .hidden { display: none !important; }

        /* Setup Mode Styles */
        .mode-select { margin-bottom: 1.5rem; }
        select, input, button { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
        button { cursor: pointer; font-weight: bold; transition: 0.2s; }
        button.primary { background-color: #007bff; color: white; border: none; }
        button.success { background-color: #28a745; color: white; border: none; }
        button.danger { background-color: #dc3545; color: white; border: none; }
        button.secondary { background-color: #6c757d; color: white; border: none; }

        .toolbar { display: flex; gap: 10px; margin-bottom: 1rem; }
        .toolbar button { flex: 1; font-size: 0.9rem; padding: 10px; }

        .segment-card { background: #f8f9fa; border: 1px solid #eee; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; position: relative; }
        .segment-card h3 { margin: 0 0 0.5rem 0; font-size: 1.1rem; display: flex; align-items: center; gap: 0.5rem; }
        .segment-controls { display: flex; justify-content: flex-end; gap: 5px; margin-top: 10px; }
        .segment-controls button { width: auto; padding: 5px 10px; font-size: 0.8rem; margin: 0; }

        /* Verified Flight State */
        .verified-badge { background: #d4edda; color: #155724; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; }

        /* Active Mode Styles */
        .timeline { margin-top: 1rem; border-left: 2px solid #ddd; padding-left: 1.5rem; margin-left: 10px; }
        .timeline-item { position: relative; margin-bottom: 2rem; }
        .timeline-item::before { content: ''; position: absolute; left: -24px; top: 0; width: 16px; height: 16px; background: #ddd; border-radius: 50%; border: 2px solid white; }
        .timeline-item.active::before { background: #007bff; }
        .timeline-item.completed::before { background: #28a745; }

        .status-badge { display: inline-block; padding: 4px 8px; border-radius: 12px; font-size: 0.75rem; color: white; background: #999; margin-bottom: 0.5rem; }
        .status-badge.active { background: #007bff; }
        .status-badge.completed { background: #28a745; }

        #coords-display { font-family: monospace; background: #222; color: #0f0; padding: 10px; border-radius: 4px; margin-top: 1rem; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="container" id="setup-view">
    <h1>🛰️ Plan Your Journey</h1>

    <div class="mode-select">
        <label><b>Trip Mode:</b></label>
        <select id="tripMode">
            <option value="returning_to_college">Returning to College</option>
            <option value="returning_home">Returning to Home</option>
            <option value="on_trip">On a Trip</option>
        </select>
    </div>

    <div id="builder-area"></div>

    <div class="toolbar">
        <button type="button" class="secondary" onclick="addSegment('flight')">+ Flight</button>
        <button type="button" class="secondary" onclick="addSegment('train')">+ Train</button>
        <button type="button" class="secondary" onclick="addSegment('taxi')">+ Taxi</button>
    </div>

    <button class="success" id="startJourneyBtn" onclick="startJourney()">Start Journey 🚀</button>
</div>

<div class="container hidden" id="active-view">
    <h2 id="active-mode-title">Current Journey</h2>
    <div id="timeline-area" class="timeline"></div>

    <div id="active-controls" style="margin-top: 2rem; border-top: 1px solid #eee; padding-top: 1rem;">
        <h3>Tracking Controls</h3>
        <p id="tracking-status">Status: Initializing...</p>
        <div id="coords-display">GPS: Waiting...</div>
        <button class="danger" onclick="stopJourney()" style="margin-top:1rem;">End Entire Journey</button>
    </div>
</div>

<script>
    // --- State ---
    let segments = []; // Array of objects: {id, type, details: {}, status: 'pending', verifiedData: null}
    const LS_KEY = "jules_trip_v4";

    // --- Setup Logic ---

    function addSegment(type) {
        const id = Date.now().toString();
        segments.push({ id, type, details: {}, status: 'pending' });
        renderBuilder();
    }

    function removeSegment(id) {
        segments = segments.filter(s => s.id !== id);
        renderBuilder();
    }

    function moveSegment(id, direction) {
        const index = segments.findIndex(s => s.id === id);
        if (index < 0) return;

        const newIndex = index + direction;
        if (newIndex >= 0 && newIndex < segments.length) {
            const temp = segments[index];
            segments[index] = segments[newIndex];
            segments[newIndex] = temp;
            renderBuilder();
        }
    }

    function updateDetails(id, key, value) {
        const seg = segments.find(s => s.id === id);
        if (seg) seg.details[key] = value;
    }

    async function verifyFlight(id) {
        const seg = segments.find(s => s.id === id);
        const btn = document.getElementById(`btn-verify-${id}`);

        if (!seg.details.iata || !seg.details.number) { alert("Enter Airline and Flight Number"); return; }

        btn.disabled = true;
        btn.innerText = "Verifying...";

        try {
            const res = await fetch('/verify_flight', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    airline_iata: seg.details.iata,
                    flight_number: seg.details.number,
                    flight_date: seg.details.date
                })
            });
            const data = await res.json();
            if (res.ok) {
                seg.verifiedData = data;
                alert(`Verified: ${data.flight_data.departure.iata} -> ${data.flight_data.arrival.iata}`);
                renderBuilder();
            } else {
                alert("Error: " + data.error);
            }
        } catch(e) { alert("Verification failed"); }
        finally { btn.disabled = false; btn.innerText = "Verify"; }
    }

    function renderBuilder() {
        const container = document.getElementById('builder-area');
        container.innerHTML = '';

        segments.forEach((seg, index) => {
            const div = document.createElement('div');
            div.className = 'segment-card';

            let content = '';

            // Header
            const icon = seg.type === 'flight' ? '✈️' : (seg.type === 'train' ? '🚆' : '🚖');
            const title = seg.type.charAt(0).toUpperCase() + seg.type.slice(1);
            content += `<h3>${icon} ${title} ${seg.verifiedData ? '<span class="verified-badge">Verified</span>' : ''}</h3>`;

            // Inputs
            if (seg.type === 'flight') {
                if (!seg.verifiedData) {
                    content += `
                        <input type="text" placeholder="Airline (e.g. 6E)" onchange="updateDetails('${seg.id}', 'iata', this.value)" value="${seg.details.iata || ''}">
                        <input type="text" placeholder="Flight No (e.g. 451)" onchange="updateDetails('${seg.id}', 'number', this.value)" value="${seg.details.number || ''}">
                        <input type="date" onchange="updateDetails('${seg.id}', 'date', this.value)" value="${seg.details.date || ''}">
                        <button class="primary" id="btn-verify-${seg.id}" onclick="verifyFlight('${seg.id}')">Verify</button>
                    `;
                } else {
                    const f = seg.verifiedData.flight_data;
                    content += `<p><b>${f.airline.name} ${f.flight.number}</b><br>${f.departure.iata} (${f.departure.scheduled}) ➝ ${f.arrival.iata}</p>`;
                }
            } else {
                content += `
                    <input type="text" placeholder="From (e.g. Home)" onchange="updateDetails('${seg.id}', 'from', this.value)" value="${seg.details.from || ''}">
                    <input type="text" placeholder="To (e.g. Station)" onchange="updateDetails('${seg.id}', 'to', this.value)" value="${seg.details.to || ''}">
                    <input type="text" placeholder="Details (e.g. Train No/Uber)" onchange="updateDetails('${seg.id}', 'info', this.value)" value="${seg.details.info || ''}">
                `;
            }

            // Controls
            content += `<div class="segment-controls">`;
            if (index > 0) content += `<button onclick="moveSegment('${seg.id}', -1)">⬆️</button>`;
            if (index < segments.length - 1) content += `<button onclick="moveSegment('${seg.id}', 1)">⬇️</button>`;
            content += `<button class="danger" onclick="removeSegment('${seg.id}')">🗑️</button>`;
            content += `</div>`;

            div.innerHTML = content;
            container.appendChild(div);
        });
    }

    // --- Active Logic ---

    async function startJourney() {
        if (segments.length === 0) { alert("Add at least one segment!"); return; }

        const mode = document.getElementById('tripMode').value;
        const payload = {
            trip_id: Date.now().toString(), // Simple ID
            user_name: "Neelaksh Saxena",
            trip_mode: mode,
            trip_start_time: new Date().toISOString(),
            segments: segments.map(s => ({
                ...s,
                status: 'pending' // Reset status just in case
            })),
            // Legacy compat for first flight if exists
            flight_info: segments.find(s => s.type === 'flight' && s.verifiedData)?.verifiedData?.flight_data
        };

        try {
            const res = await fetch('/start_trip', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            if (res.ok) {
                localStorage.setItem(LS_KEY, JSON.stringify(payload));
                loadActiveView(payload);
            } else { alert("Failed to start trip on backend"); }
        } catch(e) { alert("Network error"); }
    }

    function loadActiveView(tripData) {
        document.getElementById('setup-view').classList.add('hidden');
        document.getElementById('active-view').classList.remove('hidden');
        document.getElementById('active-mode-title').innerText = tripData.trip_mode.replace(/_/g, ' ').toUpperCase();

        segments = tripData.segments;
        renderTimeline();
        startGeolocationWatch();
    }

    function renderTimeline() {
        const container = document.getElementById('timeline-area');
        container.innerHTML = '';

        segments.forEach((seg, index) => {
            const div = document.createElement('div');
            div.className = `timeline-item ${seg.status}`;

            let title = seg.type.toUpperCase();
            let details = "";
            if (seg.type === 'flight' && seg.verifiedData) {
                const f = seg.verifiedData.flight_data;
                details = `${f.airline.iata}${f.flight.number} (${f.departure.iata} -> ${f.arrival.iata})`;
            } else {
                details = `${seg.details.from || '?'} -> ${seg.details.to || '?'}`;
            }

            let actionBtn = '';
            if (seg.status === 'pending') {
                // Show Start button only if previous is completed or it's the first one
                const prev = segments[index-1];
                if (!prev || prev.status === 'completed') {
                    actionBtn = `<button class="primary" onclick="updateSegmentStatus(${index}, 'active')">Start Segment</button>`;
                }
            } else if (seg.status === 'active') {
                actionBtn = `<button class="success" onclick="updateSegmentStatus(${index}, 'completed')">Complete Segment</button>`;
            } else {
                actionBtn = `<small>Completed</small>`;
            }

            div.innerHTML = `
                <span class="status-badge ${seg.status}">${seg.status}</span>
                <strong>${title}</strong>
                <p>${details}</p>
                ${actionBtn}
            `;
            container.appendChild(div);
        });
    }

    async function updateSegmentStatus(index, newStatus) {
        // Optimistic UI update
        segments[index].status = newStatus;
        if (newStatus === 'active') {
            // Auto complete previous active ones if any (though logic prevents it mostly)
            segments.forEach((s, i) => { if(i !== index && s.status === 'active') s.status = 'completed'; });
        }

        // Save to LS
        const currentData = JSON.parse(localStorage.getItem(LS_KEY));
        currentData.segments = segments;
        localStorage.setItem(LS_KEY, JSON.stringify(currentData));

        renderTimeline();

        // Sync Backend
        try {
            await fetch('/update_segment_status', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ segment_index: index, status: newStatus })
            });
        } catch(e) { console.error("Sync failed", e); }
    }

    async function stopJourney() {
        if(!confirm("End trip?")) return;
        await fetch('/end_trip', { method: 'POST' });
        localStorage.removeItem(LS_KEY);
        location.reload();
    }

    // --- Restore ---
    window.addEventListener('DOMContentLoaded', async () => {
        const saved = localStorage.getItem(LS_KEY);
        if (saved) {
            const data = JSON.parse(saved);
            // Check backend status
             try {
                const check = await fetch('/status');
                const checkJson = await check.json();
                if (checkJson.trip_status === 'none') {
                    // Restore backend
                     await fetch('/start_trip', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(data)
                    });
                }
                loadActiveView(data);
            } catch(e) {
                loadActiveView(data); // Offline mode
            }
        } else {
            addSegment('flight'); // Default start
        }
    });

    // --- GPS ---
    function startGeolocationWatch() {
        if (!navigator.geolocation) return;
        navigator.geolocation.watchPosition(pos => {
            const {latitude, longitude} = pos.coords;
            document.getElementById('coords-display').innerText = `GPS: ${latitude.toFixed(5)}, ${longitude.toFixed(5)}`;
             fetch('/log', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ lat: latitude, lon: longitude })
            }).catch(e => {});
        }, err => {}, {enableHighAccuracy: true});
    }

</script>

</body>
</html>
