<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jules Tracker - Sanjaya v3.2</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f5f5f5; margin: 0; padding: 1rem; }
        .container { text-align: center; padding: 2rem; background-color: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 400px; width: 100%; }
        h1 { color: #333; margin-top: 0; }
        p { color: #666; }
        button { border: none; padding: 15px 30px; border-radius: 8px; font-size: 16px; cursor: pointer; transition: background-color 0.2s; width: 100%; margin-top: 0.5rem; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
        .input-group { margin-bottom: 1rem; text-align: left; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        #verifyButton { background-color: #007bff; color: white; }
        #startTripButton { background-color: #28a745; color: white; }
        #stopTripButton { background-color: #dc3545; color: white; }
        .hidden { display: none; }
        #flight-card { background: #f8f9fa; padding: 1rem; border-radius: 8px; margin-top: 1rem; text-align: left; border: 1px solid #eee; }
        .fc-row { display: flex; justify-content: space-between; margin-bottom: 0.5rem; }
        .fc-label { font-weight: bold; color: #555; }
        #status { margin-top: 1.5rem; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛰️ Jules Tracker</h1>

        <!-- Flight Entry Section -->
        <div id="flight-controls">
            <p>Enter your flight details to begin.</p>
            <div class="input-group">
                <label for="airlineIata">Airline (IATA)</label>
                <input type="text" id="airlineIata" placeholder="e.g. 6E" value="6E">
            </div>
            <div class="input-group">
                <label for="flightNumber">Flight Number</label>
                <input type="text" id="flightNumber" placeholder="e.g. 451">
            </div>
            <button id="verifyButton">Verify Flight</button>

            <div id="flight-card" class="hidden">
                <div class="fc-row"><span class="fc-label">Route:</span> <span id="fc-route">BLR ➝ LKO</span></div>
                <div class="fc-row"><span class="fc-label">Departs:</span> <span id="fc-dep">16:15</span></div>
                <div class="fc-row"><span class="fc-label">Arrives:</span> <span id="fc-arr">18:50</span></div>
                <div class="fc-row"><span class="fc-label">Status:</span> <span id="fc-status">scheduled</span></div>
            </div>

            <button id="startTripButton" class="hidden">Confirm & Start Trip</button>
        </div>

        <!-- Active Trip Controls -->
        <div id="trip-controls" class="hidden">
            <p>Your trip is being tracked. <br><small>If connection is lost, data is saved locally.</small></p>
            <button id="stopTripButton">Stop Trip</button>
        </div>

        <p id="status">Status: Awaiting Input</p>
        <p id="coords">Coordinates: N/A</p>
    </div>

    <script>
        const flightControls = document.getElementById('flight-controls');
        const tripControls = document.getElementById('trip-controls');

        const airlineInput = document.getElementById('airlineIata');
        const flightInput = document.getElementById('flightNumber');
        const verifyButton = document.getElementById('verifyButton');
        const startTripButton = document.getElementById('startTripButton');
        const stopTripButton = document.getElementById('stopTripButton');

        const flightCard = document.getElementById('flight-card');
        const fcRoute = document.getElementById('fc-route');
        const fcDep = document.getElementById('fc-dep');
        const fcArr = document.getElementById('fc-arr');
        const fcStatus = document.getElementById('fc-status');

        const statusEl = document.getElementById('status');
        const coordsEl = document.getElementById('coords');

        let watchId = null;
        let currentFlightPayload = null;
        const LS_KEY = "jules_trip_data_v3";

        // --- Restoration Logic ---
        window.addEventListener('DOMContentLoaded', async () => {
            const savedData = localStorage.getItem(LS_KEY);
            if (savedData) {
                console.log("Found saved trip data, attempting restore...");
                statusEl.textContent = 'Status: Restoring session...';
                currentFlightPayload = JSON.parse(savedData);

                // Check if backend knows about us
                try {
                    const check = await fetch('/status');
                    const checkJson = await check.json();

                    if (checkJson.trip_status === 'none') {
                        // Backend is fresh (restarted), we must restore
                        console.log("Backend empty. Sending restore request.");
                        await startTrip(currentFlightPayload);
                    } else {
                        // Backend is active, just resume UI
                        console.log("Backend active. Resuming UI.");
                        enterActiveMode();
                    }
                } catch (e) {
                    console.error("Connection error during restore:", e);
                    // Assume we need to retry later or just show UI
                    enterActiveMode();
                }
            }
        });

        // --- Verify Flight ---
        verifyButton.addEventListener('click', async () => {
            const airline = airlineInput.value.trim();
            const number = flightInput.value.trim();

            if (!airline || !number) { alert("Please enter both airline and flight number."); return; }

            verifyButton.disabled = true;
            statusEl.textContent = 'Status: Verifying flight...';

            try {
                const res = await fetch('/verify_flight', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ airline_iata: airline, flight_number: number })
                });

                const data = await res.json();

                if (res.ok) {
                    const f = data.flight_data;
                    fcRoute.textContent = `${f.departure.iata} ➝ ${f.arrival.iata}`;
                    fcDep.textContent = new Date(f.departure.scheduled).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    fcArr.textContent = new Date(f.arrival.scheduled).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    fcStatus.textContent = f.flight_status;

                    flightCard.classList.remove('hidden');
                    startTripButton.classList.remove('hidden');
                    statusEl.textContent = 'Status: Flight verified.';

                    // Prepare Payload
                    currentFlightPayload = {
                        user_name: "Neelaksh Saxena", // Could make dynamic later
                        flight_number: `${f.airline.iata}${f.flight.number}`,
                        trip_start_time: new Date().toISOString(),
                        flight_info: {
                            status: f.flight_status,
                            scheduled_departure: f.departure.scheduled,
                            scheduled_arrival: f.arrival.scheduled,
                            origin_coords: data.coords.departure,
                            dest_coords: data.coords.arrival
                        }
                    };

                } else {
                    statusEl.textContent = `Error: ${data.error}`;
                }
            } catch (e) {
                statusEl.textContent = 'Error: Network failed.';
            } finally {
                verifyButton.disabled = false;
            }
        });

        // --- Start Trip ---
        startTripButton.addEventListener('click', async () => {
            if (!currentFlightPayload) return;
            startTripButton.disabled = true;
            statusEl.textContent = 'Status: Starting trip...';

            await startTrip(currentFlightPayload);
        });

        async function startTrip(payload) {
            try {
                const res = await fetch('/start_trip', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    // Save to LS
                    localStorage.setItem(LS_KEY, JSON.stringify(payload));
                    enterActiveMode();
                } else {
                    statusEl.textContent = 'Status: Failed to start trip.';
                    startTripButton.disabled = false;
                }
            } catch (e) {
                console.error(e);
                statusEl.textContent = 'Status: Error starting trip.';
                // If offline, maybe we still enter active mode?
                // For now, let's allow it so they can try to log points.
                localStorage.setItem(LS_KEY, JSON.stringify(payload));
                enterActiveMode();
            }
        }

        function enterActiveMode() {
            flightControls.classList.add('hidden');
            tripControls.classList.remove('hidden');
            statusEl.textContent = 'Status: Tracking Active';
            startGeolocationWatch();
        }

        // --- Stop Trip ---
        stopTripButton.addEventListener('click', async () => {
            if(!confirm("Are you sure you want to end the trip?")) return;

            stopTripButton.disabled = true;
            statusEl.textContent = 'Status: Ending trip...';
            stopGeolocationWatch();

            await fetch('/end_trip', { method: 'POST' });
            localStorage.removeItem(LS_KEY); // Clear saved data

            statusEl.innerHTML = '<h2>Trip Ended</h2><p>You can now close this window.</p>';
            coordsEl.style.display = 'none';
        });

        // --- Geolocation ---
        function startGeolocationWatch() {
            if (!navigator.geolocation) { statusEl.textContent = 'Error: Geolocation is not supported.'; return; }
            watchId = navigator.geolocation.watchPosition(
                (position) => {
                    const { latitude, longitude } = position.coords;
                    coordsEl.textContent = `Coordinates: ${latitude.toFixed(5)}, ${longitude.toFixed(5)}`;

                    // Attempt to log
                    fetch('/log', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ lat: latitude, lon: longitude })
                    }).catch(async (e) => {
                        console.log("Log failed. Server might be down or restarted.");
                        // Optional: Retry logic or check status here
                    });
                },
                (error) => { console.error('Geolocation Error:', error); },
                { enableHighAccuracy: true }
            );
        }

        function stopGeolocationWatch() {
            if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
        }
    </script>
</body>
</html>
