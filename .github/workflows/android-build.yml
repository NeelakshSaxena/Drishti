name: Android Build Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  validate:
    name: Validate and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x android/gradlew
        working-directory: ./android

      - name: Run Lint
        run: ./gradlew lintDebug
        working-directory: ./android

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x android/gradlew
        working-directory: ./android

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest
        working-directory: ./android

  build-debug:
    name: Build Debug APK
    needs: [validate, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x android/gradlew
        working-directory: ./android

      - name: Build Debug APK
        run: ./gradlew assembleDebug
        working-directory: ./android

      - name: Generate Checksums
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk > checksum-debug.txt
        working-directory: ./android

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksum-debug
          path: android/checksum-debug.txt
